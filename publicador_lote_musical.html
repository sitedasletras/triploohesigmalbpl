<script>
// ===== DADOS COMPLETOS =====

// ===== ESTADO =====
let cntOk = 0, cntErro = 0;
const total = TODOS.length;
let publicando = false;

// ===== LOG =====
function log(msg, tipo='info') {
  const el = document.getElementById('log');
  const l = document.createElement('div');
  l.className = `log-${tipo}`;
  l.textContent = `[${new Date().toLocaleTimeString('pt-BR')}] ${msg}`;
  el.appendChild(l);
  el.scrollTop = el.scrollHeight;
}

// ===== PROGRESSO =====
function atualizarProg() {
  const pct = Math.round(((cntOk + cntErro) / total) * 100);
  document.getElementById('cnt-ok').textContent = cntOk;
  document.getElementById('cnt-erro').textContent = cntErro;
  document.getElementById('barra-fill').style.width = pct + '%';
  document.getElementById('pct').textContent = pct + '%';
}

function setStatus(id, icon, result, cls) {
  const ic = document.getElementById(`ic-${id}`);
  const re = document.getElementById(`re-${id}`);
  if (ic) ic.textContent = icon;
  if (re) { re.textContent = result; re.className = `li-result ${cls}`; }
}

// ===== GITHUB API (via proxy seguro do servidor) =====
async function getSHA(caminho) {
  try {
    const res = await fetch(`/api/github-contents?repo=CeleiroLiterario&path=${encodeURIComponent(caminho)}`);
    if (res.ok) { const d = await res.json(); return d.sha; }
    return null;
  } catch { return null; }
}
async function publicarArquivo(caminho, conteudo, sha, msg) {
  const body = { repo: 'CeleiroLiterario', path: caminho, content: conteudo, message: msg };
  if (sha) body.sha = sha;
  const res = await fetch('/api/github-contents', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e = await res.json(); throw new Error(e.message || `Erro ${res.status}`); }
  return res.json();
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===== PUBLICAR TODOS =====
async function publicarTodos() {
  if (publicando) return;

  publicando = true;
  cntOk = 0; cntErro = 0;
  document.getElementById('btn-pub').disabled = true;
  document.getElementById('btn-pub').textContent = '⏳ PUBLICANDO...';

  log(`Iniciando publicação de ${total} biografias musicais...`, 'info');

  for (let i = 0; i < TODOS.length; i++) {
    const a = TODOS[i];
    setStatus(a.id, '⏳', 'PUBLICANDO', 'r-pub');
    log(`[${i+1}/${total}] ${a.nome}...`, 'info');
    try {
      const caminho = `bio_musical_${a.id.toLowerCase()}.html`;
      const html = gerarHTMLBio(a);
      const sha = await getSHA(caminho);
      await publicarArquivo(caminho, html, sha, `Bio musical: ${a.nome}`);
      cntOk++;
      setStatus(a.id, '✓', 'OK', 'r-ok');
      log(`✓ ${a.nome}`, 'ok');
    } catch(e) {
      cntErro++;
      setStatus(a.id, '✗', 'ERRO', 'r-erro');
      log(`✗ ${a.nome}: ${e.message}`, 'erro');
    }
    atualizarProg();
    await sleep(800);
  }

  // Publica índice
  log('Publicando índice de biografias musicais...', 'info');
  try {
    const htmlIndice = gerarIndice();
    const sha = await getSHA('site_musical_biografias.html');
    await publicarArquivo('site_musical_biografias.html', htmlIndice, sha, 'Atualiza índice de biografias musicais');
    log('✓ Índice musical publicado.', 'ok');
  } catch(e) { log(`✗ Índice: ${e.message}`, 'erro'); }

  publicando = false;
  document.getElementById('btn-pub').disabled = false;
  document.getElementById('btn-pub').textContent = '✓ PUBLICAÇÃO CONCLUÍDA';
  log(`─── CONCLUÍDO: ${cntOk} publicados, ${cntErro} erros. ───`, cntErro === 0 ? 'ok' : 'info');
}

// ===== RENDERIZAR LISTA =====
function renderizarLista() {
  const el = document.getElementById('lista');
  el.innerHTML = TODOS.map(a => `
    <div class="lista-item">
      <div class="li-icon" id="ic-${a.id}">○</div>
      <div class="li-nome">${a.ic} ${a.nome}</div>
      <div class="li-result r-wait" id="re-${a.id}">AGUARDANDO</div>
    </div>
  `).join('');
}

// ===== INIT =====
renderizarLista();
document.getElementById('cnt-total').textContent = total;
</script>
