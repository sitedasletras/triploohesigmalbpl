// ===== ESTADO =====
let cntOk = 0, cntErro = 0;
const total = BIOGRAFIAS.length;
let publicando = false;

// ===== LOG =====
function log(msg, tipo='info') {
  const el = document.getElementById('log');
  const linha = document.createElement('div');
  linha.className = `log-${tipo}`;
  linha.textContent = `[${new Date().toLocaleTimeString('pt-BR')}] ${msg}`;
  el.appendChild(linha);
  el.scrollTop = el.scrollHeight;
}

// ===== PROGRESSO =====
function atualizarProgresso() {
  const pct = Math.round(((cntOk + cntErro) / total) * 100);
  document.getElementById('cnt-ok').textContent = cntOk;
  document.getElementById('cnt-erro').textContent = cntErro;
  document.getElementById('barra-fill').style.width = pct + '%';
  document.getElementById('prog-pct').textContent = pct + '%';
}

function setStatusAutor(id, status, result) {
  const el = document.getElementById(`status-${id}`);
  const res = document.getElementById(`result-${id}`);
  if (el) el.textContent = status;
  if (res) { res.textContent = result; res.className = `autor-result result-${result === 'OK' ? 'ok' : result === 'ERRO' ? 'erro' : result === 'PUBLICANDO' ? 'publicando' : 'aguardando'}`; }
}

// ===== GITHUB API (via proxy seguro do servidor) =====
async function getSHA(caminho) {
  try {
    const res = await fetch(`/api/github-contents?repo=CeleiroLiterario&path=${encodeURIComponent(caminho)}`);
    if (res.ok) { const d = await res.json(); return d.sha; }
    return null;
  } catch { return null; }
}

async function publicarArquivo(caminho, conteudo, sha, mensagem) {
  const body = { repo: 'CeleiroLiterario', path: caminho, content: conteudo, message: mensagem };
  if (sha) body.sha = sha;
  const res = await fetch('/api/github-contents', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const err = await res.json(); throw new Error(err.message || `Erro ${res.status}`); }
  return res.json();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

  <div class="cab-titulo">Biografias dos Escritores</div>
  <div class="cab-desc">Conheça os autores do Site das Letras Edições Literárias. Cada biografia é atualizada a cada nova obra publicada.</div>
</div>
<div class="busca-bar">
  <input type="text" class="busca" id="busca" placeholder="Buscar por nome ou especialidade..." oninput="filtrar()">
</div>
<div class="container">
  <div class="cnt" id="cnt">${BIOGRAFIAS.length} autores no catálogo</div>
  <div class="grade" id="grade">${cards}</div>
</div>
<div class="rodape">
  <div class="rod">
    Site das Letras Edições Literárias & Multimídia<br>

<script>
const cards=document.querySelectorAll('.card');
function filtrar(){
  const b=document.getElementById('busca').value.toLowerCase();

  cards.forEach(c=>{const s=!b||c.textContent.toLowerCase().includes(b);c.style.display=s?'block':'none';if(s)v++;});
  document.getElementById('cnt').textContent=v+' autor'+(v!==1?'es':'')+' no catálogo';
}
<\/script>

}

// ===== PUBLICAR TODAS =====
async function publicarTodas() {
  if (publicando) return;

  publicando = true;
  cntOk = 0; cntErro = 0;
  document.getElementById('btn-publicar').disabled = true;
  document.getElementById('btn-publicar').textContent = '⏳ PUBLICANDO...';

  log(`Iniciando publicação de ${total} biografias...`, 'info');

  for (let i = 0; i < BIOGRAFIAS.length; i++) {
    const a = BIOGRAFIAS[i];
    setStatusAutor(a.id, '⏳', 'PUBLICANDO');
    log(`[${i+1}/${total}] Publicando ${a.nome}...`, 'info');

    try {
      const caminho = `biografia_${a.id}.html`;
      const html = gerarHtmlIndividual(a);
      const sha = await getSHA(caminho);
      await publicarArquivo(caminho, html, sha, `Biografia: ${a.nome}`);
      cntOk++;
      setStatusAutor(a.id, '✓', 'OK');
      log(`✓ ${a.nome} publicado com sucesso.`, 'ok');
    } catch(e) {
      cntErro++;
      setStatusAutor(a.id, '✗', 'ERRO');
      log(`✗ Erro em ${a.nome}: ${e.message}`, 'erro');
    }

    atualizarProgresso();
    await sleep(800); // pausa para não exceder rate limit do GitHub
  }

  // Publica o índice geral
  log('Publicando índice geral de biografias...', 'info');
  try {
    const htmlIndice = gerarHtmlIndice();
    const sha = await getSHA('site_editorial_biografias.html');
    await publicarArquivo('site_editorial_biografias.html', htmlIndice, sha, 'Atualiza índice de biografias');
    log('✓ Índice geral publicado com sucesso.', 'ok');
  } catch(e) {
    log(`✗ Erro no índice: ${e.message}`, 'erro');
  }

  publicando = false;
  document.getElementById('btn-publicar').disabled = false;
  document.getElementById('btn-publicar').textContent = '✓ PUBLICAÇÃO CONCLUÍDA';
  log(`─── CONCLUÍDO: ${cntOk} publicados, ${cntErro} erros. ───`, cntErro === 0 ? 'ok' : 'aviso');
}

// ===== RENDERIZAR LISTA =====
function renderizarLista() {
  const el = document.getElementById('lista-autores');
  el.innerHTML = BIOGRAFIAS.map(a => `
    <div class="autor-status-item">
      <div class="status-icon" id="status-${a.id}">○</div>
      <div class="autor-nome-item">${a.nome}</div>
      <div class="autor-result result-aguardando" id="result-${a.id}">AGUARDANDO</div>
    </div>
  `).join('');
}

// ===== INIT =====
renderizarLista();
document.getElementById('cnt-total').textContent = total;
</script>
