<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Fichas · Heterônimos OHE</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --preto: #04080f;
  --preto-mid: #080f1a;
  --ouro: #c9a84c;
  --ouro-claro: #e8cc7a;
  --ouro-escuro: #7a5f1a;
  --creme: #f0e8d0;
  --prata: #6a7d90;
  --verde: #00c853;
  --vermelho: #d32f2f;
  --roxo: #6a1b9a;
  --roxo-claro: #ce93d8;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--preto); color: var(--creme); font-family: 'Crimson Pro', Georgia, serif; min-height: 100vh; padding: 1.5rem; }
body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(90deg, rgba(201,168,76,0.02) 0, rgba(201,168,76,0.02) 1px, transparent 1px, transparent 60px), repeating-linear-gradient(0deg, rgba(201,168,76,0.02) 0, rgba(201,168,76,0.02) 1px, transparent 1px, transparent 60px); pointer-events: none; z-index: 0; }
.container { max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
.header { text-align: center; margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid rgba(201,168,76,0.15); }
.header-label { font-family: 'Share Tech Mono', monospace; font-size: 0.5rem; letter-spacing: 0.35em; color: var(--ouro); opacity: 0.5; text-transform: uppercase; margin-bottom: 0.5rem; }
.header-titulo { font-family: 'Cinzel', serif; font-size: clamp(1.6rem, 4vw, 2.4rem); color: var(--creme); font-weight: 400; }
.header-titulo em { color: var(--ouro); font-style: italic; font-family: 'Crimson Pro', serif; }
.header-sub { font-family: 'Crimson Pro', serif; font-style: italic; font-size: 0.9rem; color: var(--prata); margin-top: 0.4rem; }
.painel { background: var(--preto-mid); border: 1px solid rgba(201,168,76,0.12); padding: 1.5rem; margin-bottom: 1.5rem; }
.painel-titulo { font-family: 'Share Tech Mono', monospace; font-size: 0.52rem; letter-spacing: 0.25em; color: var(--ouro); opacity: 0.5; text-transform: uppercase; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.8rem; }
.painel-titulo::after { content: ''; flex: 1; height: 1px; background: rgba(201,168,76,0.1); }
.fg { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 1rem; }
.fg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.fl { font-family: 'Share Tech Mono', monospace; font-size: 0.48rem; letter-spacing: 0.18em; color: var(--prata); opacity: 0.6; text-transform: uppercase; }
.fi, .fs, .fta { background: rgba(201,168,76,0.04); border: 1px solid rgba(201,168,76,0.1); color: var(--creme); font-family: 'Crimson Pro', serif; font-size: 0.95rem; padding: 0.55rem 0.8rem; outline: none; transition: border 0.3s; width: 100%; }
.fi:focus, .fs:focus, .fta:focus { border-color: rgba(201,168,76,0.35); }
.fs option { background: var(--preto-mid); }
.fta { resize: vertical; min-height: 80px; }
.btn-p { background: linear-gradient(135deg, var(--ouro-escuro), var(--ouro)); color: var(--preto); font-family: 'Share Tech Mono', monospace; font-size: 0.58rem; font-weight: 700; letter-spacing: 0.12em; padding: 0.8rem 1.5rem; border: none; cursor: pointer; text-transform: uppercase; transition: all 0.3s; clip-path: polygon(0 0,calc(100% - 6px) 0,100% 6px,100% 100%,6px 100%,0 calc(100% - 6px)); }
.btn-p:hover { opacity: 0.85; }
.btn-p:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-s { background: transparent; color: var(--ouro); font-family: 'Share Tech Mono', monospace; font-size: 0.58rem; letter-spacing: 0.12em; padding: 0.8rem 1.5rem; border: 1px solid rgba(201,168,76,0.25); cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
.btn-s:hover { border-color: var(--ouro); }
.btn-verde { background: transparent; color: var(--verde); font-family: 'Share Tech Mono', monospace; font-size: 0.58rem; letter-spacing: 0.12em; padding: 0.8rem 1.5rem; border: 1px solid rgba(0,200,83,0.3); cursor: pointer; text-transform: uppercase; transition: all 0.3s; }
.btn-verde:hover { border-color: var(--verde); background: rgba(0,200,83,0.05); }
.acoes { display: flex; gap: 0.8rem; flex-wrap: wrap; margin-top: 1.2rem; }
.log-area { background: rgba(0,0,0,0.3); border: 1px solid rgba(201,168,76,0.08); padding: 0.8rem; margin-top: 1rem; max-height: 200px; overflow-y: auto; font-family: 'Share Tech Mono', monospace; font-size: 0.5rem; color: var(--prata); line-height: 1.8; white-space: pre-wrap; display: none; }
.log-area.visivel { display: block; }
.het-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 0.6rem; margin-bottom: 1rem; max-height: 300px; overflow-y: auto; }
.het-card { background: rgba(201,168,76,0.04); border: 1px solid rgba(201,168,76,0.1); padding: 0.8rem; cursor: pointer; transition: all 0.3s; }
.het-card:hover { border-color: rgba(201,168,76,0.3); }
.het-card.selecionado { border-color: var(--ouro); background: rgba(201,168,76,0.08); }
.het-card.gerado { border-color: var(--verde); background: rgba(0,200,83,0.06); }
.het-card.erro { border-color: var(--vermelho); background: rgba(211,47,47,0.06); }
.het-nome { font-family: 'Cinzel', serif; font-size: 0.78rem; color: var(--creme); margin-bottom: 0.2rem; }
.het-eixo { font-family: 'Share Tech Mono', monospace; font-size: 0.42rem; letter-spacing: 0.1em; color: var(--ouro); opacity: 0.5; text-transform: uppercase; }
.het-status { font-family: 'Share Tech Mono', monospace; font-size: 0.42rem; letter-spacing: 0.08em; margin-top: 0.3rem; }
.st-aguardando { color: var(--prata); }
.st-gerando { color: var(--ouro); animation: pisca 1s ease-in-out infinite; }
.st-concluido { color: var(--verde); }
.st-erro { color: var(--vermelho); }
@keyframes pisca { 0%,100%{opacity:1} 50%{opacity:0.3} }
.resultado-area { margin-top: 1rem; }
.ficha-item { background: rgba(201,168,76,0.04); border: 1px solid rgba(201,168,76,0.1); padding: 1rem; margin-bottom: 0.8rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.8rem; }
.ficha-nome { font-family: 'Cinzel', serif; font-size: 0.9rem; color: var(--creme); }
.ficha-arquivo { font-family: 'Share Tech Mono', monospace; font-size: 0.45rem; color: var(--ouro); opacity: 0.6; }
.modo-tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-bottom: 1px solid rgba(201,168,76,0.1); }
.modo-tab { font-family: 'Share Tech Mono', monospace; font-size: 0.52rem; letter-spacing: 0.12em; color: var(--prata); padding: 0.7rem 1.2rem; cursor: pointer; border: none; background: none; text-transform: uppercase; border-bottom: 2px solid transparent; margin-bottom: -1px; transition: all 0.3s; }
.modo-tab:hover { color: var(--ouro); }
.modo-tab.ativo { color: var(--ouro); border-bottom-color: var(--ouro); }
.modo-conteudo { display: none; }
.modo-conteudo.ativo { display: block; }
</style>
<script src="config.js"></script>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-label">// OHE · CELEIRO LITERÁRIO</div>
    <h1 class="header-titulo">Gerador de <em>Fichas Biográficas</em></h1>
    <p class="header-sub">Gera HTMLs de biografia no padrão do Celeiro Literário · Fernando Peçanha como curador</p>
  </div>

  <div class="modo-tabs">
    <button class="modo-tab ativo" onclick="mudarModo('lote')">📚 LOTE — TODOS OS HETERÔNIMOS</button>
    <button class="modo-tab" onclick="mudarModo('novo')">✦ NOVO HETERÔNIMO</button>
  </div>

  <!-- MODO LOTE -->
  <div class="modo-conteudo ativo" id="modo-lote">
    <div class="painel">
      <div class="painel-titulo">Selecionar Heterônimos</div>
      <div style="display:flex;gap:0.6rem;margin-bottom:1rem;flex-wrap:wrap;">
        <button class="btn-s" onclick="selecionarTodos()">SELECIONAR TODOS</button>
        <button class="btn-s" onclick="desselecionarTodos()">DESSELECIONAR</button>
      </div>
      <div class="het-grid" id="het-grid"></div>
      <div class="acoes">
        <button class="btn-p" onclick="gerarLote()" id="btn-lote">⚡ GERAR FICHAS SELECIONADAS</button>
      </div>
      <div class="log-area" id="log-lote"></div>
    </div>
    <div class="resultado-area" id="resultado-lote"></div>
  </div>

  <!-- MODO NOVO HETERÔNIMO -->
  <div class="modo-conteudo" id="modo-novo">
    <div class="painel">
      <div class="painel-titulo">Dados do Novo Heterônimo</div>
      <div class="fg-grid">
        <div class="fg">
          <label class="fl">Nome completo</label>
          <input type="text" class="fi" id="novo-nome" placeholder="Ex: Mórigan Voss">
        </div>
        <div class="fg">
          <label class="fl">Eixo</label>
          <select class="fs" id="novo-eixo">
            <option value="Prosa">Prosa</option>
            <option value="Poesia">Poesia</option>
            <option value="Híbrido">Híbrido</option>
            <option value="Cordel">Cordel</option>
            <option value="Aberto">Aberto</option>
          </select>
        </div>
      </div>
      <div class="fg">
        <label class="fl">Território literário</label>
        <input type="text" class="fi" id="novo-territorio" placeholder="Ex: Gothic cyberpunk, horror existencial urbano, corpo e máquina">
      </div>
      <div class="fg-grid">
        <div class="fg">
          <label class="fl">Formato</label>
          <input type="text" class="fi" id="novo-formato" placeholder="Ex: romance">
        </div>
        <div class="fg">
          <label class="fl">Origem / Naturalidade</label>
          <input type="text" class="fi" id="novo-origem" placeholder="Ex: Karveth, cidade fictícia">
        </div>
      </div>
      <div class="fg">
        <label class="fl">Obras publicadas (uma por linha)</label>
        <textarea class="fta" id="novo-obras" placeholder="Carne de Vidro&#10;O Inventário dos Mortos"></textarea>
      </div>
      <div class="fg">
        <label class="fl">Notas adicionais para a bio (opcional)</label>
        <textarea class="fta" id="novo-notas" placeholder="Contexto, tom, referências que a bio deve conter..."></textarea>
      </div>
      <div class="acoes">
        <button class="btn-p" onclick="gerarNovo()">✦ GERAR FICHA DO NOVO HETERÔNIMO</button>
      </div>
      <div class="log-area" id="log-novo"></div>
    </div>
    <div class="resultado-area" id="resultado-novo"></div>
  </div>

</div>

<script>

let selecionados = new Set();
let fichasGeradas = {};

// ===================== INIT =====================
window.addEventListener('load', () => {
  renderizarGrid();
});

function mostrarBanner(msg) {
  const b = document.createElement('div');
  b.style.cssText = 'background:rgba(0,200,83,0.08);border:1px solid rgba(0,200,83,0.3);padding:0.8rem 1.2rem;margin-bottom:1rem;font-family:Share Tech Mono,monospace;font-size:0.52rem;letter-spacing:0.1em;color:#00c853;text-transform:uppercase;';
  b.textContent = msg;
  document.querySelector('.container').insertBefore(b, document.querySelector('.modo-tabs'));
  setTimeout(() => b.remove(), 5000);
}

function renderizarGrid() {
  const grid = document.getElementById('het-grid');
  grid.innerHTML = HETERONIMOS.map((h, i) => `
    <div class="het-card ${selecionados.has(i) ? 'selecionado' : ''} ${fichasGeradas[i] === 'ok' ? 'gerado' : ''} ${fichasGeradas[i] === 'erro' ? 'erro' : ''}" onclick="toggleHet(${i})">
      <div class="het-nome">${h.nome}</div>
      <div class="het-eixo">${h.eixo} · ${h.formato}</div>
      <div class="het-status ${fichasGeradas[i] === 'ok' ? 'st-concluido' : fichasGeradas[i] === 'gerando' ? 'st-gerando' : fichasGeradas[i] === 'erro' ? 'st-erro' : 'st-aguardando'}" id="status-${i}">
        ${fichasGeradas[i] === 'ok' ? '✓ gerado' : fichasGeradas[i] === 'gerando' ? '⏳ gerando...' : fichasGeradas[i] === 'erro' ? '✗ erro' : '○ aguardando'}
      </div>
    </div>`).join('');
}

function toggleHet(i) {
  if (selecionados.has(i)) selecionados.delete(i);
  else selecionados.add(i);
  renderizarGrid();
}

function selecionarTodos() { HETERONIMOS.forEach((_, i) => selecionados.add(i)); renderizarGrid(); }
function desselecionarTodos() { selecionados.clear(); renderizarGrid(); }

function mudarModo(modo) {
  document.querySelectorAll('.modo-tab').forEach(t => t.classList.remove('ativo'));
  document.querySelectorAll('.modo-conteudo').forEach(c => c.classList.remove('ativo'));
  document.getElementById('modo-' + modo).classList.add('ativo');
  event.target.classList.add('ativo');
}

function logLote(msg) {
  const area = document.getElementById('log-lote');
  area.classList.add('visivel');

function logNovo(msg) {
  const area = document.getElementById('log-novo');
  area.classList.add('visivel');
  area.innerHTML += '> ' + msg + '\n';
  area.scrollTop = area.scrollHeight;
}

// ===================== GERAR BIO VIA API =====================
async function gerarBioAPI(het) {
  const prompt = `Você é Fernando Peçanha, curador da OHE — Organização Heterônima Editorial.

Escreva a biografia literária do seguinte heterônimo para publicação no Celeiro Literário:

Nome: ${het.nome}
Eixo: ${het.eixo}
Território: ${het.territorio}
Formato principal: ${het.formato}
Origem/naturalidade: ${het.origem || 'não especificada'}
${het.obras && het.obras.length > 0 ? 'Obras: ' + het.obras.join(', ') : ''}
${het.notas ? 'Notas adicionais: ' + het.notas : ''}

Escreva:
1. BIO: Um parágrafo de biografia literária (3-5 linhas). Tom elegante, editorial. NÃO mencione que é heterônimo — escreva como se fosse um autor real.
2. ESPEC: Uma frase curta de especialização (ex: "Poetisa exclusivamente de sonetos — memórias afetivas, cotidiano e emoções tratadas com rigor formal")

Responda EXATAMENTE neste formato:
---BIO---
[texto da biografia]
---ESPEC---
[frase de especialização]`;

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 500, messages: [{ role: 'user', content: prompt }] })
  });
  if (!response.ok) throw new Error('Erro ' + response.status);
  const data = await response.json();
  const texto = data.content[0].text;
  const matchBio = texto.match(/---BIO---\s*([\s\S]*?)---ESPEC---/);
  const matchEspec = texto.match(/---ESPEC---\s*([\s\S]*?)$/);
  return {
    bio: matchBio ? matchBio[1].trim() : texto,
    espec: matchEspec ? matchEspec[1].trim() : ''
  };
}

// ===================== GERAR LOTE =====================
async function gerarLote() {
  if (selecionados.size === 0) { alert('Selecione pelo menos um heterônimo.'); return; }
  document.getElementById('btn-lote').disabled = true;
  document.getElementById('log-lote').innerHTML = '';
  document.getElementById('resultado-lote').innerHTML = '';
  const dataAtual = new Date().toLocaleDateString('pt-BR');
  const indices = [...selecionados];
  logLote('Iniciando geração de ' + indices.length + ' fichas...');

  for (const i of indices) {
    const het = HETERONIMOS[i];
    fichasGeradas[i] = 'gerando';
    renderizarGrid();
    logLote('Gerando: ' + het.nome + '...');
    try {
      const { bio, espec } = await gerarBioAPI(het);
      const html = gerarHTMLFicha(het.nome, het.eixo, het.origem || '', bio, espec, het.obras || [], dataAtual);
      const nomeSlug = het.nome.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-');
      const nomeArquivo = 'biografia_' + nomeSlug + '.html';
      fichasGeradas[i] = 'ok';
      renderizarGrid();
      logLote('✓ ' + het.nome + ' → ' + nomeArquivo);
      // Adicionar botão de download
      const res = document.getElementById('resultado-lote');
      const div = document.createElement('div');
      div.className = 'ficha-item';
      div.innerHTML = `
        <div>
          <div class="ficha-nome">${het.nome}</div>
          <div class="ficha-arquivo">${nomeArquivo}</div>
        </div>
        <button class="btn-verde" onclick="downloadHTML('${nomeArquivo}', this.dataset.html)">⬇ DOWNLOAD</button>`;
      div.querySelector('button').dataset.html = encodeURIComponent(html);
      res.appendChild(div);
    } catch(e) {
      fichasGeradas[i] = 'erro';
      renderizarGrid();
      logLote('✗ ERRO em ' + het.nome + ': ' + e.message);
    }
    // Pequena pausa para não sobrecarregar a API
    await new Promise(r => setTimeout(r, 500));
  }
  logLote('Concluído! ' + Object.values(fichasGeradas).filter(v => v === 'ok').length + ' fichas geradas.');
  document.getElementById('btn-lote').disabled = false;
}

// ===================== GERAR NOVO =====================
async function gerarNovo() {
  const nome = document.getElementById('novo-nome').value.trim();
  const eixo = document.getElementById('novo-eixo').value;
  const territorio = document.getElementById('novo-territorio').value.trim();
  const formato = document.getElementById('novo-formato').value.trim();
  const origem = document.getElementById('novo-origem').value.trim();
  const obrasRaw = document.getElementById('novo-obras').value.trim();
  const notas = document.getElementById('novo-notas').value.trim();

  if (!nome) { alert('Informe o nome do heterônimo.'); return; }

  const obras = obrasRaw ? obrasRaw.split('\n').filter(o => o.trim()) : [];
  document.getElementById('log-novo').innerHTML = '';
  document.getElementById('resultado-novo').innerHTML = '';
  logNovo('Gerando ficha de ' + nome + '...');

  try {
    const het = { nome, eixo, territorio, formato, origem, obras, notas };
    const { bio, espec } = await gerarBioAPI(het);
    const dataAtual = new Date().toLocaleDateString('pt-BR');
    const html = gerarHTMLFicha(nome, eixo, origem, bio, espec, obras, dataAtual);
    const nomeSlug = nome.toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-');
    const nomeArquivo = 'biografia_' + nomeSlug + '.html';
    logNovo('✓ Ficha gerada → ' + nomeArquivo);

    const res = document.getElementById('resultado-novo');
    res.innerHTML = `
      <div class="ficha-item">
        <div>
          <div class="ficha-nome">${nome}</div>
          <div class="ficha-arquivo">${nomeArquivo} · Pronto para upload no CeleiroLiterario</div>
        </div>
        <button class="btn-verde" id="btn-dl-novo">⬇ DOWNLOAD</button>
      </div>
      <div style="background:rgba(0,0,0,0.2);border:1px solid rgba(201,168,76,0.08);padding:1rem;margin-top:0.8rem;font-family:Crimson Pro,serif;font-size:0.9rem;line-height:1.8;color:var(--creme);">
        <strong style="font-family:Share Tech Mono,monospace;font-size:0.48rem;letter-spacing:0.15em;color:var(--ouro);opacity:0.6;">BIO GERADA:</strong><br><br>
        ${bio}<br><br>
        <em style="color:var(--prata);">${espec}</em>
      </div>`;
    document.getElementById('btn-dl-novo').onclick = () => downloadHTML(nomeArquivo, encodeURIComponent(html));

  } catch(e) {
    logNovo('✗ ERRO: ' + e.message);
  }
}

// ===================== DOWNLOAD =====================
function downloadHTML(nomeArquivo, htmlEncoded) {
  const html = decodeURIComponent(htmlEncoded);
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = nomeArquivo; a.click();
  URL.revokeObjectURL(url);
}
</script>
