<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sala de Ensaio · OHE-Peçanha</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=Bebas+Neue&display=swap');

  :root {
    --bg: #0a0a0c;
    --surface: #111114;
    --border: #2a2a32;
    --accent: #c8a96e;
    --accent2: #7a9e8a;
    --muted: #6a6a72;
    --texto: #e4e2dc;
    --danger: #b56a5a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--texto);
    font-family: 'Crimson Pro', Georgia, serif;
    min-height: 100vh;
  }
  .topo {
    background: rgba(10,10,12,.97);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topo a { color: var(--accent); text-decoration: none; font-family:'Share Tech Mono',monospace; font-size:.8rem; }
  .topo h1 { font-family:'Bebas Neue', sans-serif; letter-spacing:.08em; font-size:1.3rem; color: var(--texto); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 18px 60px; }

  .tipos { display:flex; gap:8px; margin-bottom: 18px; flex-wrap:wrap; }
  .tipo-btn {
    flex:1; min-width:150px; padding:12px; border-radius:10px; border:1.5px solid var(--border);
    background: var(--surface); color: var(--muted); cursor:pointer; text-align:center;
    font-family:'Share Tech Mono',monospace; font-size:.75rem; letter-spacing:.04em; transition:.2s;
  }
  .tipo-btn:hover { border-color: var(--accent2); }
  .tipo-btn.ativo { border-color: var(--accent); color: var(--accent); background: rgba(200,169,110,.08); }

  #bloco-nome { display:none; margin-bottom:18px; }
  label { display:block; font-family:'Share Tech Mono',monospace; font-size:.7rem; color: var(--muted); letter-spacing:.06em; margin-bottom:6px; text-transform:uppercase; }
  input[type="text"] {
    width:100%; padding:11px 12px; border-radius:8px; border:1.5px solid var(--border);
    background: var(--surface); color: var(--texto); font-family:'Crimson Pro',serif; font-size:1rem;
  }
  input[type="text"]:focus { outline:none; border-color: var(--accent); }
  .btn {
    padding:10px 16px; border-radius:8px; border:1.5px solid var(--accent); background:transparent;
    color: var(--accent); font-family:'Share Tech Mono',monospace; font-size:.75rem; letter-spacing:.04em;
    cursor:pointer; margin-top:10px;
  }
  .btn:hover { background: rgba(200,169,110,.1); }

  #ficha-preview { margin-top:14px; padding:14px; border-radius:10px; background: var(--surface); border:1px solid var(--border); font-size:.92rem; line-height:1.55; display:none; }
  #ficha-preview strong { color: var(--accent); }
  #ficha-preview p { margin-top:6px; color:#c0bdb4; }

  #bloco-acao { margin-top:12px; }
  .btn-acao {
    display:inline-block; padding:10px 16px; border-radius:8px; background: var(--accent2); color:#0a0a0c;
    text-decoration:none; font-family:'Share Tech Mono',monospace; font-size:.75rem; letter-spacing:.03em;
  }

  #bloco-chat { display:none; margin-top:22px; }
  #chat-log { max-height:420px; overflow-y:auto; padding:14px; border-radius:10px; background: var(--surface); border:1px solid var(--border); margin-bottom:12px; }
  .msg { margin-bottom:12px; line-height:1.5; }
  .msg.user { text-align:right; color: var(--texto); }
  .msg.user .bolha { display:inline-block; background: rgba(122,158,138,.15); border:1px solid var(--accent2); border-radius:10px 10px 2px 10px; padding:8px 12px; max-width:80%; }
  .msg.personagem .bolha { display:inline-block; background: rgba(200,169,110,.1); border:1px solid var(--accent); border-radius:10px 10px 10px 2px; padding:8px 12px; max-width:80%; }
  .msg.sistema { color: var(--muted); font-family:'Share Tech Mono',monospace; font-size:.72rem; text-align:center; }
  .msg.erro { color: var(--danger); font-family:'Share Tech Mono',monospace; font-size:.75rem; }
  .msg.carregando { color: var(--muted); font-style:italic; }

  .linha-input { display:flex; gap:8px; }
  .linha-input input { flex:1; }
</style>
<script src="config.js"></script>
<script src="heteronimos_roster.js"></script>
<script src="biografias_heteronimos.js"></script>
<script src="perfis_voz.js"></script>
<script src="elenco_bpl.js"></script>
<script src="elenco_musical.js"></script>
<script src="perfil_vocal.js"></script>
<script src="checklist_antiia.js"></script>
<script src="ia_gratuita.js"></script>
</head>
<body>

<div class="topo">
  <a href="espinha_dorsal.html">← Espinha Dorsal</a>
  <h1>SALA DE ENSAIO</h1>
  <div></div>
</div>

<div class="wrap">
  <p style="color:var(--muted);font-size:.85rem;margin-bottom:18px;line-height:1.6">
    Converse com um heterônimo, ator do BPL ou cantor do Sigmal Music antes de encomendar a obra de verdade —
    usa a IA gratuita (Gemini/OpenRouter), então testar a voz não gasta o Claude pago.
  </p>

  <div class="tipos">
    <div class="tipo-btn" id="tipo-heteronimo" onclick="selecionarTipo('heteronimo')">✎ Heterônimo literário</div>
    <div class="tipo-btn" id="tipo-ator" onclick="selecionarTipo('ator')">🎭 Ator do BPL</div>
    <div class="tipo-btn" id="tipo-cantor" onclick="selecionarTipo('cantor')">🎤 Cantor Sigmal Music</div>
  </div>

  <div id="bloco-nome">
    <label>Nome</label>
    <input type="text" id="nome-input" list="lista-nomes" placeholder="Digite ou escolha um nome..." onchange="selecionarNome()">
    <datalist id="lista-nomes"></datalist>
    <button class="btn" onclick="selecionarNome()">Carregar ficha</button>

    <div id="ficha-preview"></div>
    <div id="bloco-acao"></div>
  </div>

  <div id="bloco-chat">
    <div id="chat-log"></div>
    <div class="linha-input">
      <input type="text" id="msg-input" placeholder="Escreva sua mensagem..." onkeydown="if(event.key==='Enter')enviarMensagem()">
      <button class="btn" onclick="enviarMensagem()">Enviar</button>
    </div>
  </div>
</div>

<script>
let estado = { tipo: null, nome: null, historico: [] };

function selecionarTipo(tipo) {
  estado.tipo = tipo;
  estado.nome = null;
  estado.historico = [];
  document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('ativo'));
  document.getElementById('tipo-' + tipo).classList.add('ativo');
  popularNomes(tipo);
  document.getElementById('bloco-nome').style.display = 'block';
  document.getElementById('bloco-chat').style.display = 'none';
  document.getElementById('ficha-preview').style.display = 'none';
  document.getElementById('bloco-acao').innerHTML = '';
  document.getElementById('nome-input').value = '';
}

function popularNomes(tipo) {
  const dl = document.getElementById('lista-nomes');
  dl.innerHTML = '';
  let nomes = [];
  if (tipo === 'heteronimo' && typeof getRosterCompleto === 'function') nomes = getRosterCompleto().map(h => h.nome);
  if (tipo === 'ator' && typeof ARTISTAS !== 'undefined') nomes = ARTISTAS.map(a => a.nome);
  if (tipo === 'cantor' && typeof TODOS !== 'undefined') nomes = TODOS.filter(t => t.cat === 'voz').map(t => t.nome);
  nomes.sort((a, b) => a.localeCompare(b, 'pt-BR')).forEach(n => {
    const opt = document.createElement('option');
    opt.value = n;
    dl.appendChild(opt);
  });
}

function montarFicha(tipo, nome) {
  const blocoAntiIA = (typeof montarBlocoAntiIA === 'function') ? montarBlocoAntiIA() : '';

  if (tipo === 'heteronimo') {
    const h = (typeof getHeteronimoPorNome === 'function') ? getHeteronimoPorNome(nome) : null;
    if (!h) return null;
    const bio = (typeof getBiografiaPorNome === 'function') ? (getBiografiaPorNome(nome) || '') : '';
    const blocoVoz = (typeof montarBlocoPerfilVoz === 'function') ? montarBlocoPerfilVoz(nome) : '';
    const systemPrompt = `Você é ${h.nome}, heterônimo literário da OHE (Oficina Heteronímica da Escrita). Eixo: ${h.eixo}. Território narrativo: ${h.territorio}.${bio ? '\n\nBIOGRAFIA:\n' + bio : ''}${blocoVoz}${blocoAntiIA}

Isto é uma CONVERSA DE BASTIDOR com Wagner, seu curador — não é a escrita de uma obra. Responda em primeira pessoa, curto (1 a 4 frases), no seu jeito de falar, como quem está batendo papo antes de começar a escrever algo novo.`;
    const fichaHtml = `<strong>${h.nome}</strong> — ${h.eixo} · ${h.territorio}${bio ? '<p>' + bio.substring(0, 220) + '...</p>' : ''}`;
    const deepLinkHtml = `<a class="btn-acao" href="gerador_obra.html?het=${encodeURIComponent(nome)}" target="_blank">✦ Começar obra com ${h.nome} →</a>`;
    return { systemPrompt, fichaHtml, deepLinkHtml };
  }

  if (tipo === 'ator') {
    const a = (typeof getArtistaBplPorNome === 'function') ? getArtistaBplPorNome(nome) : null;
    if (!a) return null;
    const perfil = (typeof getPerfilVocalPorNome === 'function') ? getPerfilVocalPorNome(nome) : null;
    const blocoVocal = perfil ? `\n\nPERFIL VOCAL: ${perfil.arquetipoVocal} (tessitura: ${perfil.tessitura})` : '';
    const systemPrompt = `Você é ${a.nome}, ator/atriz do Banco de Personagens Literários (BPL). Origem: ${a.origem}. Especialidade: ${a.especialidade}. Personalidade: ${a.personalidade} Físico: ${a.fisico}${blocoVocal}${blocoAntiIA}

Isto é uma CONVERSA DE BASTIDOR com Wagner, o produtor — não é a escrita de um roteiro. Responda em primeira pessoa, curto (1 a 4 frases), no seu jeito de ser, como quem está conhecendo o produtor antes de aceitar um papel novo.`;
    const fichaHtml = `<strong>${a.nome}</strong> — ${a.especialidade} · ${a.origem}<p>${a.personalidade}</p>${perfil ? '<p>🔊 ' + perfil.tessitura + '</p>' : ''}`;
    const deepLinkHtml = `<a class="btn-acao" href="https://celeiro-literario.vercel.app/silo_cinematografico.html?autor=${encodeURIComponent(nome)}" target="_blank">✦ Criar roteiro com ${a.nome} →</a>`;
    return { systemPrompt, fichaHtml, deepLinkHtml };
  }

  if (tipo === 'cantor') {
    const m = (typeof getArtistaMusicalPorNome === 'function') ? getArtistaMusicalPorNome(nome) : null;
    if (!m) return null;
    const perfil = (typeof getPerfilVocalPorNome === 'function') ? getPerfilVocalPorNome(nome) : null;
    const blocoVocal = perfil ? `\n\nPERFIL VOCAL: ${perfil.arquetipoVocal} (tessitura: ${perfil.tessitura})` : '';
    const systemPrompt = `Você é ${m.nome}, artista da SIGMAL Music. Origem: ${m.orig}. Estilo: ${m.estilo}. ${m.bio || ''}${blocoVocal}${blocoAntiIA}

Isto é uma CONVERSA DE BASTIDOR com Wagner — não é a composição de uma letra. Responda em primeira pessoa, curto (1 a 4 frases), no seu jeito de ser, como quem está conhecendo o produtor antes de gravar algo novo.`;
    const fichaHtml = `<strong>${m.nome}</strong> — ${m.estilo} · ${m.orig}<p>${m.sabor || ''}</p>${perfil ? '<p>🔊 ' + perfil.tessitura + '</p>' : ''}`;
    const deepLinkHtml = `<a class="btn-acao" href="sigmal_music_studio.html?interprete=${encodeURIComponent(nome)}" target="_blank">✦ Compor com ${m.nome} no Sigmal Music Studio →</a>`;
    return { systemPrompt, fichaHtml, deepLinkHtml };
  }

  return null;
}

function selecionarNome() {
  const nome = document.getElementById('nome-input').value.trim();
  if (!nome || !estado.tipo) return;

  const info = montarFicha(estado.tipo, nome);
  if (!info) {
    alert('Nome não encontrado no banco — verifique a grafia.');
    return;
  }

  estado.nome = nome;
  estado.historico = [];
  estado._systemPrompt = info.systemPrompt;

  const preview = document.getElementById('ficha-preview');
  preview.innerHTML = info.fichaHtml;
  preview.style.display = 'block';
  document.getElementById('bloco-acao').innerHTML = info.deepLinkHtml;

  const log = document.getElementById('chat-log');
  log.innerHTML = `<div class="msg sistema">Conversa iniciada com ${nome}. Bate-papo de teste (IA gratuita) pra sentir a voz antes de encomendar a obra de verdade — não vale como capítulo/roteiro/letra final.</div>`;
  document.getElementById('bloco-chat').style.display = 'block';
}

function adicionarMsg(tipo, texto) {
  const log = document.getElementById('chat-log');
  const div = document.createElement('div');
  div.className = 'msg ' + tipo;
  if (tipo === 'user' || tipo === 'personagem') {
    div.innerHTML = `<span class="bolha"></span>`;
    div.querySelector('.bolha').textContent = texto;
  } else {
    div.textContent = texto;
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function enviarMensagem() {
  const inputEl = document.getElementById('msg-input');
  const texto = inputEl.value.trim();
  if (!texto || !estado.nome) return;
  inputEl.value = '';
  adicionarMsg('user', texto);
  estado.historico.push({ role: 'user', texto });

  const transcript = estado.historico.map(h => (h.role === 'user' ? 'Wagner: ' : estado.nome + ': ') + h.texto).join('\n');
  const userPrompt = `${transcript}\n${estado.nome}:`;

  const msgCarregando = adicionarMsg('carregando', '...');
  try {
    const resposta = await chamarIAGratuita(estado._systemPrompt, userPrompt, 400);
    msgCarregando.remove();
    adicionarMsg('personagem', resposta);
    estado.historico.push({ role: 'personagem', texto: resposta });
  } catch (e) {
    msgCarregando.remove();
    adicionarMsg('erro', 'Erro: ' + e.message);
  }
}
</script>
</body>
</html>
