<style>
  body { background:#04080f; color:#f0e8d0; font-family:monospace; padding:2rem; text-align:center; }
  h1 { color:#c9a84c; font-size:0.8rem; letter-spacing:0.3em; text-transform:uppercase; margin-bottom:2rem; }
  .card { background:rgba(201,168,76,0.04); border:1px solid rgba(201,168,76,0.15); border-radius:8px; padding:1rem 1.5rem; margin-bottom:1rem; text-align:left; }

<body>
<h1>// Injetar obras no Calabouço · OHE</h1>

<div class="card">
  <div class="autor">Baltasar de Morais Seixas</div>
  <div class="titulo">A Cruz Sem Margem</div>
  <div class="status" id="s1">Aguardando...</div>
</div>

<div class="card">
  <div class="autor">Mirela Voss Drummond</div>
  <div class="titulo">O Que Resta Depois do Fogo</div>
  <div class="status" id="s2">Aguardando...</div>
</div>

<button class="btn" onclick="injetar()">⚡ ENVIAR PARA O CALABOUÇO</button>

<script>
function injetar() {
  try {
    const estado = JSON.parse(localStorage.getItem('sigmal_estado') || '{"calabouco":[],"masmorra":[],"paiol":{"literario":[]}}');
    if (!estado.calabouco) estado.calabouco = [];

    const obras = [
      {
        id: Date.now(),
        titulo: "A Cruz Sem Margem",
        autor: "Baltasar de Morais Seixas",
        eixo: "\u00c9pica e espiritualidade ib\u00e9rica \u2014 onde a f\u00e9 se torna espada e o mar, testamento",
        tipo: 'livro',
        destino: 'calabouco',
        status: 'processado',
        progresso: 100,
        conteudo: "No vig\u00e9simo terceiro ano do reinado de Dom Manuel, o Venturoso, havia um cavaleiro da Ordem de Cristo chamado Rodrigo de Anuncia\u00e7\u00e3o, cuja espada jamais havia sido desembainhada em batalha alguma \u2014 n\u00e3o por covardia, mas porque Deus lhe havia reservado um outro tipo de ferida.\n\nRodrigo nascera em \u00c9vora, numa casa que cheirava a cal e alecrim, e desde mo\u00e7o aprendera que a Ordem de Cristo n\u00e3o era apenas uma confraria de guerreiros, mas uma congrega\u00e7\u00e3o de homens que haviam decidido que o sagrado e o oceano eram, no fundo, a mesma coisa: sem fundo. Tomara os votos aos dezoito anos, recebera o manto branco com a cruz vermelha de oito pontas, e durante uma d\u00e9cada servira como escriv\u00e3o nas casas da Ordem em Tomar, copiando cartas de doa\u00e7\u00e3o de terras em ilhas que nenhum mapa ainda havia aprendido a desenhar direito.\n\nEnt\u00e3o veio o navio.\n\nEra mar\u00e7o de 1500 quando Rodrigo embarcou na frota de Pedro \u00c1lvares Cabral, n\u00e3o como capit\u00e3o nem como soldado, mas como capel\u00e3o auxiliar e representante da Ordem \u2014 sua fun\u00e7\u00e3o era registrar, rezar e testemunhar. Os outros cavaleiros que iam na frota eram homens de outra constitui\u00e7\u00e3o: bra\u00e7os largos, vozes de pedra, olhos acostumados ao sangue. Rodrigo levava um tinteiro preso \u00e0 cinta e um ros\u00e1rio que sua m\u00e3e lhe dera na hora da despedida, t\u00e3o apertado naquele momento que as contas ainda guardavam, ele jurava, o calor dos dedos dela.\n\nA viagem foi longa da maneira que apenas o mar sabe ser longo: n\u00e3o em dist\u00e2ncia, mas em sil\u00eancio.\n\nRodrigo passou as semanas entre o tombadilho e a c\u00e2mara de popa, ora escrevendo, ora olhando o horizonte com a express\u00e3o de quem espera que algu\u00e9m o complete. Havia um marinheiro galego a bordo, de nome Afonso Boroas, que dormia no conv\u00e9s mesmo nas noites de vento, e que todas as manh\u00e3s acordava cantarolando uma toada incompreens\u00edvel. Rodrigo perguntou-lhe certa vez de onde vinha aquela can\u00e7\u00e3o.\n\n\u2014 N\u00e3o sei, senhor escriv\u00e3o. Aprendi dormindo.\n\nRodrigo anotou isso no seu caderno sem entender ao certo por qu\u00ea.\n\nNa madrugada de vinte e um de abril, um marinheiro gritou do alto do mastro que havia terra. O grito desceu pelo navio como um calafrio, e Rodrigo acordou sobressaltado, com o ros\u00e1rio enrolado no pulso. Saiu para o conv\u00e9s e viu, na linha cinzenta do horizonte, uma sombra espessa que n\u00e3o era nuvem nem n\u00e9voa: era ch\u00e3o. Era um monte de forma redonda que eles batizariam de Monte Pascoal, mas que ali, naquela hora entre a noite e o n\u00e3o-noite, n\u00e3o tinha nome nenhum e por isso parecia mais real do que qualquer coisa que Rodrigo houvesse visto na vida.\n\nEle ficou im\u00f3vel por um tempo que n\u00e3o soube medir.\n\nA cruz no seu manto pesava diferente. N\u00e3o era o peso do tecido \u2014 era outro peso, de dentro.\n\nNos dias seguintes, quando foram \u00e0 terra e encontraram os primeiros habitantes daquele lugar, Rodrigo ficou \u00e0 margem das negocia\u00e7\u00f5es e dos gestos de Cabral. Olhava os homens e mulheres de pele cor de cobre com uma aten\u00e7\u00e3o que n\u00e3o era curiosidade nem medo: era uma esp\u00e9cie de reconhecimento imposs\u00edvel. Eles n\u00e3o usavam nada que os cobrisse acima da vergonha, e no entanto havia neles uma dignidade que Rodrigo, homem de votos e manto, sentiu como uma acusa\u00e7\u00e3o suave \u2014 como se Deus estivesse, por um instante, do outro lado do argumento.\n\nUm velho daquele povo chegou at\u00e9 onde Rodrigo estava e ficou olhando para a cruz bordada em seu peito. N\u00e3o disse nada. Estendeu um dedo e tocou o tecido, muito devagar, como quem toca uma ferida alheia sem querer machucar.\n\nRodrigo n\u00e3o recuou.\n\nO velho retirou a m\u00e3o, olhou para ele, e sorriu \u2014 n\u00e3o com esc\u00e1rnio, n\u00e3o com medo. Com uma esp\u00e9cie de pena fraterna que Rodrigo levaria consigo pelo resto da vida.\n\nNaquela noite, sentado no conv\u00e9s enquanto o navio balan\u00e7ava ancorado perto da costa, Rodrigo abriu o caderno e tentou escrever. A pena ficou suspensa por um longo tempo. Depois ele escreveu apenas uma linha:\n\n*Cheg\u00e1mos ao fim do mundo e o mundo estava aqui antes de n\u00f3s.*\n\nDeixou secar, fechou o caderno, e ficou olhando a cruz da Ordem de Cristo bordada no manto que estava dobrado ao seu lado. Oito pontas. Oito dire\u00e7\u00f5es poss\u00edveis. Ele pensou nos cavaleiros templ\u00e1rios que haviam dado origem \u00e0 Ordem, naqueles homens que foram \u00e0 Terra Santa convencidos de que Deus precisava de lan\u00e7a. Pensou no quanto a cruz havia viajado para chegar at\u00e9 ali \u2014 da Palestina a Portugal, de Portugal ao oceano, do oceano a este monte de nome redondo \u2014 e em como, a cada viagem, ela acumulava um peso diferente.\n\nN\u00e3o era o peso da gl\u00f3ria.\n\nEra o peso das coisas que n\u00e3o t\u00eam nome ainda.\n\nRodrigo de Anuncia\u00e7\u00e3o voltou a Lisboa com a frota, mas algo ficou na costa daquele lugar. Ele passou os anos seguintes em Tomar, copiando cartas, rezando nas horas can\u00f4nicas, envelhecendo com a lentid\u00e3o ordenada dos homens de convento. Nunca falou muito sobre o que tinha visto. Quando algu\u00e9m perguntava, ele dizia apenas que haviam encontrado terra nova, e que a terra era muito verde.\n\nMas \u00e0 noite, \u00e0s vezes, ele acordava com a sensa\u00e7\u00e3o do dedo do velho tocando a cruz em seu peito \u2014 aquele toque que n\u00e3o era rever\u00eancia nem desafio, mas algo anterior a ambos.\n\nE ent\u00e3o ele pegava o ros\u00e1rio, rezava o que sabia rezar, e esperava que o mar dentro dele baixasse um pouco antes do amanhecer.",
        dataProcessamento: new Date().toLocaleDateString('pt-BR'),
        origem: 'Máquina Desafio · passado · medieval'
      },
      {
        id: Date.now() + 1,
        titulo: "O Que Resta Depois do Fogo",
        autor: "Mirela Voss Drummond",
        eixo: "Prosa liter\u00e1ria \u2014 o que resta nos vivos depois da perda",
        tipo: 'livro',
        destino: 'calabouco',
        status: 'processado',
        progresso: 100,
        conteudo: "A casa ainda cheirava a ele quando Beatriz voltou, tr\u00eas semanas ap\u00f3s o enterro. N\u00e3o o cheiro de homem vivo \u2014 suor, tabaco, o sabonete de alfazema que ela comprava em farm\u00e1cia \u2014 mas algo mais antigo, que precede o corpo e parece sobreviver a ele: o cheiro de presen\u00e7a, de algu\u00e9m que por anos ocupou o mesmo espa\u00e7o e deixou nele uma impress\u00e3o t\u00e3o profunda quanto um m\u00f3vel sobre madeira de lei.\n\nEla n\u00e3o abriu as janelas.\n\nOs filhos tinham ido embora na tarde anterior, depois de dois dias tentando convenc\u00ea-la a vender o im\u00f3vel, a mudar-se, a come\u00e7ar, segundo a express\u00e3o de Carmem, a sua nova vida. Beatriz tinha assentido com a cabe\u00e7a sem dizer nada, o que aprendera ao longo dos anos ser a melhor maneira de encerrar conversas que n\u00e3o lhe pertenciam.\n\nAgora eram quatro da manh\u00e3 e ela estava sentada na cadeira dele \u2014 a cadeira de couro que ficava junto \u00e0 janela da sala, voltada para o jardim \u2014, com uma x\u00edcara de ch\u00e1 que j\u00e1 esfriara entre as m\u00e3os. N\u00e3o conseguia dormir no quarto. N\u00e3o porque o quarto a assombrasse, mas porque n\u00e3o a assombrava o suficiente. A cama era grande demais e silenciosa demais, e o sil\u00eancio l\u00e1 dentro tinha a qualidade errada: era o sil\u00eancio de um lugar vazio, n\u00e3o de um lugar em repouso.\n\nNa cadeira, ao menos, ela conseguia imaginar.\n\nN\u00e3o era loucura, isso ela sabia distinguir. Era apenas uma forma de economia: guardar o que podia ser guardado antes que o tempo, que \u00e9 sempre mais voraz do que a morte, levasse tudo. Ela fechava os olhos e reconstitu\u00eda a voz dele com a precis\u00e3o de uma restauradora que conhece cada camada de verniz. A cad\u00eancia particular com que ele dizia o seu nome \u2014 duas s\u00edlabas que na boca de qualquer outro soavam banais e na boca dele carregavam toda uma hist\u00f3ria conjugal, um repert\u00f3rio de brigas e reconcilia\u00e7\u00f5es, de viagens e doen\u00e7as, de sil\u00eancios bons e sil\u00eancios que custavam caro.\n\nBeatriz tinha sessenta e tr\u00eas anos e nunca havia morado sozinha.\n\nEssa era a verdade que ela n\u00e3o dissera a nenhum dos filhos, ao padre, \u00e0 amiga Vera que viera de Recife para o enterro e ficara uma semana fazendo comida que Beatriz mal tocava. Ela n\u00e3o estava de luto apenas por Ant\u00f4nio. Estava de luto por uma compet\u00eancia que nunca precisara desenvolver: a de existir sem testemunha.\n\nPor quarenta e um anos houvera algu\u00e9m que sabia onde ela estava.\n\nN\u00e3o que Ant\u00f4nio fosse um homem vigilante ou ciumento \u2014 pelo contr\u00e1rio, era desatento da maneira distra\u00edda e afetuosa dos homens que confiam plenamente. Mas havia entre eles aquela ci\u00eancia m\u00fatua e silenciosa: o saber onde o outro se encontra, o calcular mentalmente a que horas ele chegar\u00e1, o sentir, em algum lugar abaixo do pensamento consciente, a gravidade do outro puxando a sua pr\u00f3pria \u00f3rbita. Agora essa gravidade havia cessado. E Beatriz se descobria flutuando de um c\u00f4modo a outro sem trajet\u00f3ria, sem o peso que antes organizava o seu movimento.\n\nEla olhou para o jardim.\n\nHavia uma roseira que Ant\u00f4nio plantara no inverno de 2011, quando ele se aposentou e passou a precisar de alguma coisa para fazer com as m\u00e3os. Ele n\u00e3o tinha jeito para jardim \u2014 matara tr\u00eas bougainvilles antes de admiti-lo \u2014 mas a roseira havia prosperado com uma teimosia que Beatriz na \u00e9poca atribu\u00edra \u00e0 planta e agora come\u00e7ava a suspeitar que fosse dele, dessa persist\u00eancia calada que ele tinha para as coisas que queria de verdade.\n\nA roseira estava florida.\n\nIsso era demais. Ela havia esperado que a planta ao menos tivesse a dec\u00eancia de estar murcha.\n\nBeatriz levantou-se da cadeira com o cuidado de algu\u00e9m que carrega algo fr\u00e1gil dentro do corpo e foi at\u00e9 a cozinha colocar mais \u00e1gua para ferver. Havia um ato de resist\u00eancia no simples gesto de preparar outro ch\u00e1 \u00e0s quatro da manh\u00e3. N\u00e3o sabia bem contra o qu\u00ea resistia. Contra a ideia de que devia estar dormindo, talvez. Contra a ideia de que havia um modo correto de fazer isto.\n\nEnquanto aguardava, encostou-se \u00e0 pia e olhou para o im\u00e3 de geladeira que ela e Ant\u00f4nio tinham comprado em Lisboa, em 1998, numa viagem que comemorara n\u00e3o sabia mais o qu\u00ea \u2014 talvez nada espec\u00edfico, talvez apenas o fato de ainda estarem juntos e terem dinheiro suficiente para cruzar o oceano. O im\u00e3 era feio: um galo de cer\u00e2mica pintado de amarelo com as cores da bandeira portuguesa. Tinham rido dele na loja. Tinham comprado por isso mesmo.\n\nPor um momento ela pensou em jog\u00e1-lo fora.\n\nPor um momento pensou em n\u00e3o jogar nada fora jamais.\n\nDepois a chaleira apitou e ela encheu a x\u00edcara e voltou para a sala, para a cadeira de couro, para o jardim invis\u00edvel por tr\u00e1s do vidro escuro. A roseira estava l\u00e1, ela sabia, mesmo sem ver. Isso tamb\u00e9m era uma forma de conhecimento: saber que algo existe no escuro porque voc\u00ea o conhece suficientemente bem para dispensar a vis\u00e3o.\n\nTalvez fosse assim que ela aprenderia a carregar Ant\u00f4nio.\n\nN\u00e3o como uma presen\u00e7a que ela convoca, mas como uma certeza que ela n\u00e3o precisa verificar. Como a roseira. Como o seu pr\u00f3prio nome dito por uma voz que o mundo havia decidido calar.\n\nBeatriz bebeu o ch\u00e1.\n\nDo jardim, n\u00e3o veio nenhum sinal \u2014 e esta era, ela come\u00e7ava a entender, a \u00fanica resposta poss\u00edvel e, estranhamente, a \u00fanica que ela conseguia suportar.",
        dataProcessamento: new Date().toLocaleDateString('pt-BR'),
        origem: 'Máquina Desafio · presente · luto e memória'
      }
    ];

    obras.forEach(o => estado.calabouco.push(o));
    localStorage.setItem('sigmal_estado', JSON.stringify(estado));

    document.getElementById('s1').textContent = '✓ Injetado no Calabouço';
    document.getElementById('s1').className = 'status ok';
    document.getElementById('s2').textContent = '✓ Injetado no Calabouço';
    document.getElementById('s2').className = 'status ok';

    document.querySelector('.btn').textContent = '✓ PRONTO · Abra o triplo';
    document.querySelector('.btn').style.background = '#4caf50';
    document.querySelector('.btn').style.color = 'white';
    document.querySelector('.btn').onclick = () => window.location.href = '/';

  } catch(e) {
    alert('Erro: ' + e.message);
  }
}
</script>
</body>
</html>
